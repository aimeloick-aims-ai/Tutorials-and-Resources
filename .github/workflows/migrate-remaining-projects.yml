name: Consolidate remaining curated projects

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-remaining-projects.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source repositories
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/aimeloick-aims-ai/ML-a-Scale-.git /tmp/ml-scale
          git clone --depth 1 https://github.com/aimeloick-aims-ai/Entrainement-Symfony-5-Clone-de-Pinterest-.git /tmp/symfony

      - name: Copy curated ML at Scale files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p machine-learning/ml-at-scale
          rsync -a \
            --exclude='.git/' \
            --exclude='README.md' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='*.pkl' \
            --exclude='*.db' \
            --exclude='movie_descriptions_cache.json' \
            --exclude='movie_images_cache.json' \
            --exclude='my_ratings.csv' \
            /tmp/ml-scale/ machine-learning/ml-at-scale/

      - name: Copy curated Symfony learning project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p software-development/symfony-pinterest-clone
          rsync -a \
            --exclude='.git/' \
            --exclude='README.md' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='var/' \
            /tmp/symfony/ software-development/symfony-pinterest-clone/

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/migrate-remaining-projects.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Consolidate remaining curated learning project files'
          git push
